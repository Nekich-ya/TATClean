[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tatclean"
version = "1.1.0"
description = "A safety-first Windows desktop cleaner and system maintenance suite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TAT Clean Contributors"}]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["PyQt6>=6.7,<7", "psutil>=5.9.8,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
tatclean = "tatclean.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tatclean.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra"
markers = ["windows: requires native Windows APIs (only scratch files and read-only queries)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
